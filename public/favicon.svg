<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Terminal Bracket/Chevron on top left -->
  <path d="M12 18 L18 24 L12 30" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bold Geometric 'T' -->
  <!-- Horizontal Top Bar -->
  <rect x="24" y="18" width="28" height="7" rx="3" fill="url(#primaryGrad)" filter="url(#glow)"/>
  
  <!-- Vertical Stem -->
  <rect x="34.5" y="24" width="7" height="24" rx="3" fill="url(#primaryGrad)"/>

  <!-- Terminal Blinking Underscore / Pulse Dot -->
  <circle cx="50" cy="46" r="3" fill="#38bdf8" filter="url(#glow)"/>
</svg>